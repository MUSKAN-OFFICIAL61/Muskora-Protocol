<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FILE_0 - System</title>

    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="page3.css">
</head>

<body>

    <main class="system-screen">

        <!-- Header -->

        <header class="system-header">

            <div>
                <span class="system-name">FILE_0 SYSTEM</span>
                <span class="system-status">● ONLINE</span>
            </div>

            <div>
                <span>ACCESS ID:</span>
                <span id="playerId">UNKNOWN</span>
            </div>

        </header>


        <!-- Main Content -->

        <section class="dashboard">

            <div class="dashboard-title">
                <p>SYSTEM // MAIN INTERFACE</p>
                <h1>ARCHIVE ACCESS</h1>
            </div>


            <!-- System Options -->

            <div class="system-grid">

                <button class="system-card" id="terminal">
                    <span class="card-number">01</span>
                    <h2>TERMINAL</h2>
                    <p>COMMAND INTERFACE</p>
                </button>

                <button class="system-card" id="files">
                    <span class="card-number">02</span>
                    <h2>FILES</h2>
                    <p>ARCHIVED DATA</p>
                </button>

                <button class="system-card" id="cameras">
                    <span class="card-number">03</span>
                    <h2>CAMERAS</h2>
                    <p>SURVEILLANCE</p>
                </button>

                <button class="system-card" id="logs">
                    <span class="card-number">04</span>
                    <h2>LOGS</h2>
                    <p>SYSTEM RECORDS</p>
                </button>

                <button class="system-card" id="database">
                    <span class="card-number">05</span>
                    <h2>DATABASE</h2>
                    <p>USER INFORMATION</p>
                </button>

                <button class="system-card" id="network">
                    <span class="card-number">06</span>
                    <h2>NETWORK</h2>
                    <p>CONNECTED NODES</p>
                </button>

            </div>


            <!-- Bottom status -->

            <div class="dashboard-status">

                <span>SECURITY: ACTIVE</span>

                <span>ARCHIVE: ONLINE</span>

                <span>THREAT LEVEL: LOW</span>

            </div>

        </section>

    </main>


    <script src="page3.js"></script>

</body>

</html>
